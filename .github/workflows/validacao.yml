name: validacao

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: baixar codigo
        uses: actions/checkout@v4

      - name: preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1

      - name: validar sintaxe
        run: python -m compileall -q app tests

      - name: executar testes
        run: python -m pytest -q -p no:cacheprovider

      - name: construir imagem de teste
        run: docker build --tag acta-fcm-api:teste .

      - name: verificar resposta HTTP da imagem
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name fcm-teste acta-fcm-api:teste
          trap 'docker rm --force fcm-teste >/dev/null' EXIT
          for tentativa in {1..30}; do
            if docker exec fcm-teste python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/api/v1/me/openapi.json', timeout=2)"; then
              exit 0
            fi
            sleep 1
          done
          docker logs fcm-teste
          exit 1